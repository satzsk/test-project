---
apiVersion: v1
kind: pod
metadata:
  name: nginx
  labels:
    app: nginx
  namespace: argocd
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5